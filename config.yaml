# CodeSentry Configuration

# ==========================================================================
# LLM Provider Configuration
# ==========================================================================
# Set `provider` to whichever entry under `providers` you want active, then
# point `model` at that provider's model id. Every provider is called over
# plain HTTPS (no vendor SDKs required) so adding a new OpenAI-compatible
# endpoint (LM Studio, vLLM, LocalAI, Together, Groq, ...) is just a new
# entry under `providers` with `type: openai_compatible`.
#
# Set the matching API key as an environment variable (see `api_key_env`
# below for each provider). Providers with `api_key_env: null` (e.g. a local
# Ollama server) don't need a key at all.
llm:
  provider: "huggingface"
  model: "Qwen/Qwen3-Coder-30B-A3B-Instruct:scaleway"
  max_tokens: 2000
  temperature: 0.3
  timeout: 60
  stream: false

  providers:
    # Hugging Face Inference Providers router (default) — open-source models
    huggingface:
      type: openai_compatible
      api_url: "https://router.huggingface.co/v1/chat/completions"
      api_key_env: "HF_TOKEN"

    # OpenAI
    openai:
      type: openai_compatible
      api_url: "https://api.openai.com/v1/chat/completions"
      api_key_env: "OPENAI_API_KEY"

    # Azure OpenAI Service
    azure_openai:
      type: azure_openai
      # Full deployment URL, e.g.:
      # https://<resource>.openai.azure.com/openai/deployments/<deployment>/chat/completions
      api_url: ""
      api_version: "2024-06-01"
      api_key_env: "AZURE_OPENAI_API_KEY"

    # Anthropic Claude
    anthropic:
      type: anthropic
      api_url: "https://api.anthropic.com/v1/messages"
      api_version: "2023-06-01"
      api_key_env: "ANTHROPIC_API_KEY"

    # Google Gemini
    google:
      type: google
      api_url: "https://generativelanguage.googleapis.com/v1beta/models"
      api_key_env: "GOOGLE_API_KEY"

    # Local Ollama server (no API key needed)
    ollama:
      type: openai_compatible
      api_url: "http://localhost:11434/v1/chat/completions"
      api_key_env: null

    # OpenRouter (aggregates many commercial + open models)
    openrouter:
      type: openai_compatible
      api_url: "https://openrouter.ai/api/v1/chat/completions"
      api_key_env: "OPENROUTER_API_KEY"

    # Groq (fast open-weight model inference)
    groq:
      type: openai_compatible
      api_url: "https://api.groq.com/openai/v1/chat/completions"
      api_key_env: "GROQ_API_KEY"

    # Together AI (open-weight model hosting)
    together:
      type: openai_compatible
      api_url: "https://api.together.xyz/v1/chat/completions"
      api_key_env: "TOGETHER_API_KEY"

    # Mistral AI
    mistral:
      type: openai_compatible
      api_url: "https://api.mistral.ai/v1/chat/completions"
      api_key_env: "MISTRAL_API_KEY"

    # DeepSeek
    deepseek:
      type: openai_compatible
      api_url: "https://api.deepseek.com/v1/chat/completions"
      api_key_env: "DEEPSEEK_API_KEY"

    # Any other OpenAI-compatible endpoint (self-hosted vLLM/LocalAI/LM Studio/etc.)
    custom:
      type: openai_compatible
      api_url: ""
      api_key_env: "CUSTOM_LLM_API_KEY"

# ChromaDB Configuration
chromadb:
  persist_directory: ".chroma_db"
  collection_name: "code_embeddings"

# Embedding Model Configuration
embeddings:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  chunk_size: 500
  chunk_overlap: 50

# ==========================================================================
# Static Analysis Configuration
# ==========================================================================
# Each language runs whichever of its tools are installed on PATH; missing
# tools are skipped with a warning rather than failing the run. Install the
# ones you need (e.g. `npm i -g eslint`, `gem install rubocop`, `pip install
# cppcheck` isn't a thing but your OS package manager has it, etc.).
static_analysis:
  enabled: true
  file_extensions:
    - .py
    - .js
    - .jsx
    - .mjs
    - .cjs
    - .ts
    - .tsx
    - .java
    - .go
    - .rs
    - .rb
    - .php
    - .c
    - .h
    - .cpp
    - .cc
    - .hpp

  languages:
    python:
      extensions: [.py]
      tools: [pylint, flake8, bandit, radon]
    javascript:
      extensions: [.js, .jsx, .mjs, .cjs, .ts, .tsx]
      tools: [eslint]
    go:
      extensions: [.go]
      tools: [go_vet, gofmt, staticcheck]
    rust:
      extensions: [.rs]
      tools: [clippy]
    ruby:
      extensions: [.rb]
      tools: [rubocop]
    php:
      extensions: [.php]
      tools: [php_lint]
    java:
      extensions: [.java]
      tools: [checkstyle]
    cpp:
      extensions: [.c, .h, .cpp, .cc, .hpp]
      tools: [cppcheck]

# RAG Configuration
rag:
  top_k_results: 5
  similarity_threshold: 0.7
  use_reranking: true

# ==========================================================================
# Quality Scoring Configuration
# ==========================================================================
# CodeSentry converts static analysis findings into a single 0-100 quality
# score. Deductions are weighted per severity, then averaged per file
# analyzed, so the score reflects issue *density* rather than raw count -
# a 5-file script and a 500-file monorepo score the same for the same
# level of code quality.
scoring:
  enabled: true
  base_score: 100
  weights:
    error: 5
    security: 8
    warning: 2
    info: 0.25
    high_complexity: 3
  grade_bands:
    A: 90
    B: 80
    C: 70
    D: 60
    F: 0

# ==========================================================================
# Rule Engine Configuration
# ==========================================================================
# Define pass/fail policy for CI. Each rule compares a metric against a
# value with an operator. `severity: fail` causes CodeSentry to exit with a
# non-zero status code when the rule doesn't hold (useful for CI gates /
# pre-commit hooks); `severity: warn` is reported but never fails the run.
#
# Available metrics:
#   score, total_issues, error_issues, warning_issues, info_issues,
#   security_issues, high_complexity_functions
# Available operators: >=, <=, ==, !=, >, <
rules:
  enabled: true
  conditions:
    - name: "Minimum quality score"
      metric: score
      operator: ">="
      value: 70
      severity: fail

    - name: "No security vulnerabilities"
      metric: security_issues
      operator: "=="
      value: 0
      severity: fail

    - name: "Limit critical errors"
      metric: error_issues
      operator: "<="
      value: 10
      severity: fail

    - name: "Limit high-complexity functions"
      metric: high_complexity_functions
      operator: "<="
      value: 5
      severity: warn

# Report Configuration
report:
  output_dir: "reports"
  filename_template: "code_review_{timestamp}.html"
  include_metrics: true
  include_suggestions: true

# Exclusions
exclude:
  directories:
    - node_modules
    - venv
    - .venv
    - env
    - .git
    - __pycache__
    - build
    - dist
    - target
    - vendor
    - .chroma_db
  files:
    - "*.min.js"
    - "*.min.css"
    - "*.pyc"
    - "*_pb2.py"
    - "*.pb.go"
