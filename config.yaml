# CodeSentry Configuration

# Hugging Face API Configuration
llm:
  api_url: "https://router.huggingface.co/v1/chat/completions"
  model: "Qwen/Qwen3-Coder-30B-A3B-Instruct:scaleway"
  stream: true
  max_tokens: 2000
  temperature: 0.3

# ChromaDB Configuration
chromadb:
  persist_directory: ".chroma_db"
  collection_name: "code_embeddings"

# Embedding Model Configuration
embeddings:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  chunk_size: 500
  chunk_overlap: 50

# ==========================================================================
# Static Analysis Configuration
# ==========================================================================
# Each language runs whichever of its tools are installed on PATH; missing
# tools are skipped with a warning rather than failing the run. Install the
# ones you need (e.g. `npm i -g eslint`, `gem install rubocop`, `pip install
# cppcheck` isn't a thing but your OS package manager has it, etc.).
static_analysis:
  enabled: true
  file_extensions:
    - .py
    - .js
    - .jsx
    - .mjs
    - .cjs
    - .ts
    - .tsx
    - .java
    - .go
    - .rs
    - .rb
    - .php
    - .c
    - .h
    - .cpp
    - .cc
    - .hpp

  languages:
    python:
      extensions: [.py]
      tools: [pylint, flake8, bandit, radon]
    javascript:
      extensions: [.js, .jsx, .mjs, .cjs, .ts, .tsx]
      tools: [eslint]
    go:
      extensions: [.go]
      tools: [go_vet, gofmt, staticcheck]
    rust:
      extensions: [.rs]
      tools: [clippy]
    ruby:
      extensions: [.rb]
      tools: [rubocop]
    php:
      extensions: [.php]
      tools: [php_lint]
    java:
      extensions: [.java]
      tools: [checkstyle]
    cpp:
      extensions: [.c, .h, .cpp, .cc, .hpp]
      tools: [cppcheck]

# RAG Configuration
rag:
  top_k_results: 5
  similarity_threshold: 0.7
  use_reranking: true

# Report Configuration
report:
  output_dir: "reports"
  filename_template: "code_review_{timestamp}.html"
  include_metrics: true
  include_suggestions: true

# Exclusions
exclude:
  directories:
    - node_modules
    - venv
    - .venv
    - env
    - .git
    - __pycache__
    - build
    - dist
    - target
    - vendor
    - .chroma_db
  files:
    - "*.min.js"
    - "*.min.css"
    - "*.pyc"
    - "*_pb2.py"
    - "*.pb.go"
